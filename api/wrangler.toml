name = "stocks-api2"
main = "src/index.js"
compatibility_date = "2024-01-01"

# 自定义域名（Cloudflare 面板 Custom Domains 中绑定）：
#   stocks-api2.365200.xyz → stocks-api2
# 若面板已绑定 Custom Domains，此处的 routes 可注释掉，避免部署需要 Zone 权限。

# 免费计划：10 万请求/天
# 部署后接口地址：https://stocks-api2.365200.xyz/kline
# 首页（项目介绍 + API 文档）：https://stocks-api2.365200.xyz/

# R2 存储绑定：数据存放在 Cloudflare R2（bucket 名与采集端 R2_BUCKET 一致）
[[r2_buckets]]
binding = "MARKET_DATA_R2"
bucket_name = "stocks-api2"

# 边缘缓存：Worker 通过 Cache API（caches.default）将高频接口结果缓存在边缘，
# 命中时短路返回，不执行业务逻辑、不读 R2。有效降低 Worker CPU/请求额度与 R2 读次数。
# - kline / quote / news / universe / indices / symbols / download：TTL 见 src/index.js CACHE_TTL
#   （历史数据 60s，元数据/清单 300s）
# - price（实时）：只缓存 15s，平衡实时性与额度
# - 无需在此额外配置缓存规则，TTL 由代码里的 Cache-Control 控制

# KV 存储绑定：静态清单（universe/indices）+ 选股快照
# KV 读取毫秒级、不计 Worker CPU、不消耗 R2 读额度。
# 采集端写 R2 的同时双写 KV；Worker 优先读 KV，miss 时 fallback 到 R2。
[[kv_namespaces]]
binding = "STATIC_KV"
id = "6ec220d973654f7981364ac1340863df"

[observability]
enabled = true