# market-data-r2 服务器采集 crontab
# 使用：deploy.sh 会自动安装到 crontab（替换 %REPO_DIR%/crontab.conf 路径）

# ── 分钟K（沪深300 + 纳指100）每 1 分钟 ──────────────────────
# 脚本内部自动跳过非交易时段，不会浪费请求
* * * * * cd /opt/market-data-r2 && . ./.env && .venv/bin/python scripts/sync_minute_realtime_pure.py --index csi300 --region cn >> logs/csi300.log 2>&1
* * * * * cd /opt/market-data-r2 && . ./.env && .venv/bin/python scripts/sync_minute_realtime_pure.py --index nasdaq100 --region us >> logs/nasdaq100.log 2>&1

# ── 聚合新闻（Yahoo HK + 东方财富）每 30 分钟 ─────────────────
*/30 * * * * cd /opt/market-data-r2 && . ./.env && .venv/bin/python scripts/fetch_agg_news.py >> logs/news.log 2>&1

# ── 日K 全市场（按各市场收盘后）──────────────────────────────
# A股：北京 15:10 = UTC 07:10（周一~周五）
10 7 * * 1-5 cd /opt/market-data-r2 && . ./.env && .venv/bin/python scripts/sync_incremental.py --region cn >> logs/daily_cn.log 2>&1

# 美股盘前：美东 04:00 = UTC 09:00
0 9 * * 1-5 cd /opt/market-data-r2 && . ./.env && .venv/bin/python scripts/sync_incremental.py --region us --batch 0 --batches 4 >> logs/daily_us.log 2>&1
1 9 * * 1-5 cd /opt/market-data-r2 && . ./.env && .venv/bin/python scripts/sync_incremental.py --region us --batch 1 --batches 4 >> logs/daily_us.log 2>&1
2 9 * * 1-5 cd /opt/market-data-r2 && . ./.env && .venv/bin/python scripts/sync_incremental.py --region us --batch 2 --batches 4 >> logs/daily_us.log 2>&1
3 9 * * 1-5 cd /opt/market-data-r2 && . ./.env && .venv/bin/python scripts/sync_incremental.py --region us --batch 3 --batches 4 >> logs/daily_us.log 2>&1

# 美股盘中：美东 08:00 = UTC 13:00
0 13 * * 1-5 cd /opt/market-data-r2 && . ./.env && .venv/bin/python scripts/sync_incremental.py --region us --batch 0 --batches 4 >> logs/daily_us.log 2>&1
1 13 * * 1-5 cd /opt/market-data-r2 && . ./.env && .venv/bin/python scripts/sync_incremental.py --region us --batch 1 --batches 4 >> logs/daily_us.log 2>&1
2 13 * * 1-5 cd /opt/market-data-r2 && . ./.env && .venv/bin/python scripts/sync_incremental.py --region us --batch 2 --batches 4 >> logs/daily_us.log 2>&1
3 13 * * 1-5 cd /opt/market-data-r2 && . ./.env && .venv/bin/python scripts/sync_incremental.py --region us --batch 3 --batches 4 >> logs/daily_us.log 2>&1

# 美股盘后：美东 16:40 = UTC 21:40
40 21 * * 1-5 cd /opt/market-data-r2 && . ./.env && .venv/bin/python scripts/sync_incremental.py --region us --batch 0 --batches 4 >> logs/daily_us.log 2>&1
41 21 * * 1-5 cd /opt/market-data-r2 && . ./.env && .venv/bin/python scripts/sync_incremental.py --region us --batch 1 --batches 4 >> logs/daily_us.log 2>&1
42 21 * * 1-5 cd /opt/market-data-r2 && . ./.env && .venv/bin/python scripts/sync_incremental.py --region us --batch 2 --batches 4 >> logs/daily_us.log 2>&1
43 21 * * 1-5 cd /opt/market-data-r2 && . ./.env && .venv/bin/python scripts/sync_incremental.py --region us --batch 3 --batches 4 >> logs/daily_us.log 2>&1

# 港股/韩股/美股ETF/中国ETF（每日盘后一并）
50 21 * * 1-5 cd /opt/market-data-r2 && . ./.env && .venv/bin/python scripts/sync_incremental.py --region hk >> logs/daily_others.log 2>&1
51 21 * * 1-5 cd /opt/market-data-r2 && . ./.env && .venv/bin/python scripts/sync_incremental.py --region kr >> logs/daily_others.log 2>&1
52 21 * * 1-5 cd /opt/market-data-r2 && . ./.env && .venv/bin/python scripts/sync_incremental.py --region etf >> logs/daily_others.log 2>&1
53 21 * * 1-5 cd /opt/market-data-r2 && . ./.env && .venv/bin/python scripts/sync_incremental.py --region cn_etf >> logs/daily_others.log 2>&1