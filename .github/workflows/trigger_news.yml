name: Trigger News Fetch

# 只做一件事：每 5 分钟唤醒 news-aggregator 的采集工作流。
# 背景：GitHub 对新建仓库的 schedule 长时间不注册（实测 news-aggregator / news-cron 建仓 6 小时
#       event=schedule 均为 0），而本仓库的调度器是正常的，因此借用本仓库的 cron 作为闹钟。
# 与行情流水线完全独立，单独一个 workflow，互不影响。

on:
  schedule:
    # 错开 :02/:07/... 触发，避开与分钟 K 任务的整点竞争
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: trigger-news-fetch
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 唤醒 news-aggregator 采集
        env:
          DISPATCH_TOKEN: ${{ secrets.NEWS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "缺少 NEWS_DISPATCH_TOKEN，跳过"
            exit 0
          fi
          code=$(curl -s -o /tmp/resp -w "%{http_code}" -X POST \
            -H "Authorization: token $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/448776129/news-aggregator/actions/workflows/daily-news.yml/dispatches \
            -d '{"ref":"main"}')
          echo "dispatch HTTP $code"
          cat /tmp/resp || true
          # 204 = 已受理；409/422 多为上一轮还没结束，属于正常，不判定失败
          case "$code" in
            204|409|422) exit 0 ;;
            *) exit 1 ;;
          esac
