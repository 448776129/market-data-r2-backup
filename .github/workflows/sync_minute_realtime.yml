name: Sync Minute K (Realtime)

# 高频分钟K同步：沪深300 + 纳指100，每 5 分钟一次
# 公开仓库 Actions 额度无限
#
# 流程：
#   1. 直连 Yahoo 拉取最新 1m K线（含延长时段）→ gzip 写入 R2
#   2. 重采样 5m/15m/30m → 写入 R2
#   3. 计算选股指标 → 写入 KV 快照
#
# 直连 Yahoo（YAHOO_DIRECT=1）：GitHub Actions 海外运行无 403，
#   并避开反代 img2.365200.xyz 的限流（之前导致新闻 429）。
# 仅处理交易时段，休市自动跳过。

on:
  schedule:
    # 每 5 分钟（GitHub Actions cron 最低 5 分钟）
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      index:
        description: "指数：csi300 / nasdaq100 / both"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - csi300
          - nasdaq100

env:
  PYTHON_VERSION: "3.12"

# 防止重叠运行（同一指数的并发请求可能触发 Yahoo 限流）
concurrency:
  group: sync-minute-realtime
  cancel-in-progress: true

jobs:
  sync-csi300:
    name: Minute K · 沪深300
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.index == 'both' || github.event.inputs.index == 'csi300')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Sync 1m K-line → R2 + KV (csi300) · 纯Python无依赖
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          FETCH_CONCURRENCY: "10"
          YAHOO_DIRECT: "1"
        run: python scripts/sync_minute_realtime_pure.py --index csi300 --region cn

  sync-nasdaq100:
    name: Minute K · 纳指100
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.index == 'both' || github.event.inputs.index == 'nasdaq100')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Sync 1m K-line → R2 + KV (nasdaq100) · 纯Python无依赖
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          FETCH_CONCURRENCY: "10"
          YAHOO_DIRECT: "1"
        run: python scripts/sync_minute_realtime_pure.py --index nasdaq100 --region us

